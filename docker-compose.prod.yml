# Production. Both apps bind plain HTTP to loopback; the host's cloudflared
# picks them up from there.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# One app serves both: /api/* is the comment API blogs call, everything else is
# the admin console. Point one public hostname at it:
#   <domain> -> http://localhost:8017
# and register https://<domain>/signin-google as a Google redirect URI.
#
# The console uses Blazor interactive server rendering, so the tunnel must pass
# WebSockets through — cloudflared does by default.
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: comments
      POSTGRES_USER: komment
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # PG18 puts PGDATA under /var/lib/postgresql/<major>/docker and declares
      # /var/lib/postgresql as the volume — mounting .../data persists nothing.
      - postgres-data:/var/lib/postgresql
    # Backend migrates on boot, so it must not start against a half-open server.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U komment -d comments"]
      interval: 5s
      retries: 10

  komment:
    build: ./Backend
    restart: unless-stopped
    env_file: .env
    environment:
      # cloudflared forwards X-Forwarded-Proto: https and preserves the original
      # Host, which is what the Google redirect_uri and the Secure cookie need.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__comments: Host=postgres;Database=comments;Username=komment;Password=${POSTGRES_PASSWORD}
      # Both cookies are encrypted with these; losing them signs out every blog
      # reader and every admin at once.
      DATAPROTECTION_KEYS: /keys
    volumes:
      - komment-keys:/keys
    # Loopback only — this is unencrypted HTTP, and the tunnel is the only thing
    # that should reach it.
    ports:
      - "127.0.0.1:8017:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  komment-keys:
