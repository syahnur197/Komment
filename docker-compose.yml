services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: comments
      POSTGRES_USER: komment
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # PG18 puts PGDATA under /var/lib/postgresql/<major>/docker and declares
      # /var/lib/postgresql as the volume — mounting .../data persists nothing.
      - postgres-data:/var/lib/postgresql
    # Backend migrates on boot, so it must not start against a half-open server.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U komment -d comments"]
      interval: 5s
      retries: 10

  komment:
    build: ./Backend
    env_file: .env
    environment:
      ConnectionStrings__comments: Host=postgres;Database=comments;Username=komment;Password=${POSTGRES_PASSWORD}
    ports:
      # API and admin console, same app: /api/* for blogs, everything else is the
      # console. The admin cookie is SameSite=Lax, so it sticks over plain HTTP.
      - "8017:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
